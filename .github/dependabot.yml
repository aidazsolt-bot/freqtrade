version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  cooldown:
    default-days: 7
    exclude:
      - ccxt
  schedule:
    interval: "cron"
    # Monday at 01:25
    cronjob: "25 1 * * 1"
  open-pull-requests-limit: 15
  target-branch: develop
  groups:
    types:
      patterns:
        - "types-*"
    pytest:
      patterns:
        - "pytest*"
    mkdocs:
      patterns:
        - "mkdocs*"
    scipy:
      patterns:
        - "scipy"
        - "scipy-stubs"
    gymnasium:
      patterns:
        - "gymnasium"
        - "stable-baselines3"
        - "sb3-contrib"
- package-ecosystem: "github-actions"
  directory: "/"
  cooldown:
    default-days: 7
  schedule:
    interval: "cron"
    # Monday at 03:00
    cronjob: "0 3 * * 1"
  open-pull-requests-limit: 10
  target-branch: develop
  groups:
    actions:
      patterns:
        - "actions/*"
