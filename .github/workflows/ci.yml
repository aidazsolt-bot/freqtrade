name: Freqtrade CI

on:
  push:
    branches:
      - stable
      - develop
      - ci/*
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true
permissions: {}

jobs:
  ci:
    name: "pip / pytest / wheel / smoke"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements*.txt
          docs/requirements-docs.txt
          ft_client/requirements.txt

    - name: Install requirements (pip)
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt
        python -m pip install ./ft_client
        python -m pip install -e .

    - name: Pytest
      run: |
        pytest --random-order --durations 20 -n auto

    - name: Build wheel
      run: |
        python -m build --wheel
        ls -la dist/

    - name: Install wheel
      run: |
        python -m pip uninstall -y freqtrade
        python -m pip install dist/freqtrade-*.whl
        freqtrade --version

    - name: Generate strategy and brief dry-run start
      run: |
        freqtrade create-userdir --userdir user_data
        cp tests/testdata/config.tests.json user_data/config.json
        freqtrade new-strategy -s CiSmokeStrategy --template minimal --userdir user_data
        # Start briefly; timeout exit 124 means the bot ran until we stopped it.
        timeout 45s freqtrade trade \
          --config user_data/config.json \
          --strategy CiSmokeStrategy \
          --db-url sqlite:///user_data/tradesv3.ci.sqlite \
          || test $? -eq 124
